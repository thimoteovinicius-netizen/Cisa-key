<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solicitação de Despesas de Viagem</title>

    <!-- =====================================================
         jsPDF
    ====================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --azul: #1976a8;

            --azul-escuro: #125a80;

            --azul-medio: #4fa8cf;

            --azul-claro: #e8f5fb;

            --azul-muito-claro: #f4fbfe;

            --cinza: #66727a;

            --cinza-claro: #f4f6f8;

            --cinza-borda: #dce3e8;

            --branco: #ffffff;

            --texto: #263238;

            --verde: #198754;

            --vermelho: #dc3545;

        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dceff7 0%,
                    #edf3f6 50%,
                    #dfe6ea 100%
                );

            min-height: 100vh;

            padding:
                25px 15px;

            color:
                var(--texto);

        }


        .app {

            width: 100%;

            max-width: 950px;

            margin: auto;

        }


        /* =====================================================
           CABEÇALHO
        ====================================================== */

        .header {

            background:
                var(--branco);

            border-radius:
                18px;

            padding:
                25px 30px;

            margin-bottom:
                20px;

            box-shadow:
                0 10px 30px
                rgba(
                    40,
                    70,
                    90,
                    0.12
                );

            border-top:
                5px solid
                var(--azul);

        }


        .titulo-editavel {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color:
                var(--azul);

            font-size:
                1.7rem;

            font-weight:
                700;

        }


        .header p {

            color:
                var(--cinza);

            font-size:
                0.9rem;

            margin-top:
                8px;

        }


        /* =====================================================
           SOLICITAÇÃO
        ====================================================== */

        .solicitacao {

            position: relative;

            background:
                var(--branco);

            border-radius:
                18px;

            margin-bottom:
                25px;

            box-shadow:
                0 8px 25px
                rgba(
                    40,
                    70,
                    90,
                    0.10
                );

            overflow:
                hidden;

        }


        .solicitacao-header {

            background:
                linear-gradient(
                    135deg,
                    #1976a8,
                    #4fa8cf
                );

            color:
                white;

            padding:
                16px 22px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .solicitacao-header strong {

            font-size:
                1rem;

        }


        .btn-remover-solicitacao {

            border: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            color:
                white;

            padding:
                7px 12px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-weight:
                600;

        }


        .btn-remover-solicitacao:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.30
                );

        }


        .solicitacao-body {

            padding:
                25px;

        }


        /* =====================================================
           TÍTULOS DE SEÇÃO
        ====================================================== */

        .card-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            color:
                var(--azul);

            font-size:
                1.05rem;

            font-weight:
                700;

            margin-bottom:
                20px;

            padding-bottom:
                12px;

            border-bottom:
                1px solid
                var(--cinza-borda);

        }


        .card-number {

            width:
                28px;

            height:
                28px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                var(--azul-claro);

            color:
                var(--azul);

            border-radius:
                50%;

            font-size:
                0.85rem;

            font-weight:
                bold;

            flex-shrink:
                0;

        }


        /* =====================================================
           FORMULÁRIO
        ====================================================== */

        .form-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                18px;

        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

        }


        label {

            font-size:
                0.85rem;

            font-weight:
                600;

            color:
                #455a64;

            margin-bottom:
                7px;

        }


        input,
        textarea {

            width:
                100%;

            padding:
                13px 14px;

            border:
                1px solid
                var(--cinza-borda);

            border-radius:
                9px;

            background:
                #fbfcfd;

            color:
                var(--texto);

            font-family:
                inherit;

            font-size:
                0.95rem;

            outline:
                none;

            transition:
                0.2s;

        }


        input:focus,
        textarea:focus {

            border-color:
                var(--azul-medio);

            background:
                white;

            box-shadow:
                0 0 0 3px
                rgba(
                    79,
                    168,
                    207,
                    0.12
                );

        }


        textarea {

            min-height:
                100px;

            resize:
                vertical;

        }


        /* =====================================================
           VEÍCULO
        ====================================================== */

        .vehicle-options {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                15px;

        }


        .vehicle-option {

            position:
                relative;

        }


        .vehicle-option input {

            position:
                absolute;

            opacity:
                0;

            pointer-events:
                none;

        }


        .vehicle-label {

            display:
                block;

            padding:
                16px;

            border:
                2px solid
                var(--cinza-borda);

            border-radius:
                12px;

            text-align:
                center;

            cursor:
                pointer;

            color:
                var(--cinza);

            font-weight:
                600;

            transition:
                0.2s;

        }


        .vehicle-label:hover {

            border-color:
                var(--azul-medio);

            background:
                var(--azul-claro);

        }


        .vehicle-option input:checked
        + .vehicle-label {

            border-color:
                var(--azul);

            background:
                var(--azul-claro);

            color:
                var(--azul);

        }


        /* =====================================================
           ROTEIRO
        ====================================================== */

        .route-item {

            display:
                grid;

            grid-template-columns:
                35px 1fr 42px;

            gap:
                10px;

            align-items:
                center;

            margin-bottom:
                12px;

        }


        .route-icon {

            width:
                30px;

            height:
                30px;

            border-radius:
                50%;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            background:
                var(--azul-claro);

            color:
                var(--azul);

            font-weight:
                bold;

            font-size:
                0.8rem;

        }


        .route-icon.start {

            background:
                #eef1f3;

            color:
                #54636b;

        }


        .route-icon.final {

            background:
                #e7f6ee;

            color:
                var(--verde);

        }


        .remove-stop {

            width:
                38px;

            height:
                38px;

            border:
                none;

            border-radius:
                8px;

            background:
                #fff0f1;

            color:
                var(--vermelho);

            cursor:
                pointer;

            font-size:
                1.1rem;

        }


        .remove-stop:hover {

            background:
                #ffd9dd;

        }


        .add-stop {

            width:
                100%;

            padding:
                11px;

            margin-top:
                5px;

            border:
                1px dashed
                var(--azul-medio);

            background:
                var(--azul-claro);

            color:
                var(--azul);

            border-radius:
                9px;

            cursor:
                pointer;

            font-weight:
                600;

        }


        .add-stop:hover {

            background:
                #d8edf7;

        }


        /* =====================================================
           BOTÃO NOVA SOLICITAÇÃO
        ====================================================== */

        .nova-solicitacao {

            width:
                100%;

            border:
                2px dashed
                var(--azul-medio);

            background:
                var(--azul-muito-claro);

            color:
                var(--azul);

            padding:
                16px;

            border-radius:
                12px;

            cursor:
                pointer;

            font-weight:
                700;

            font-size:
                0.95rem;

            margin-bottom:
                20px;

            transition:
                0.2s;

        }


        .nova-solicitacao:hover {

            background:
                var(--azul-claro);

            transform:
                translateY(-1px);

        }


        /* =====================================================
           AÇÕES
        ====================================================== */

        .actions {

            background:
                var(--branco);

            padding:
                20px;

            border-radius:
                18px;

            box-shadow:
                0 8px 25px
                rgba(
                    40,
                    70,
                    90,
                    0.10
                );

            margin-bottom:
                20px;

        }


        .btn-pdf {

            width:
                100%;

            border:
                none;

            padding:
                17px;

            border-radius:
                11px;

            background:
                linear-gradient(
                    135deg,
                    #1976a8,
                    #4fa8cf
                );

            color:
                white;

            font-size:
                1rem;

            font-weight:
                700;

            cursor:
                pointer;

            box-shadow:
                0 7px 18px
                rgba(
                    25,
                    118,
                    168,
                    0.25
                );

            transition:
                0.2s;

        }


        .btn-pdf:hover {

            transform:
                translateY(-2px);

        }


        .footer {

            text-align:
                center;

            color:
                #73818a;

            font-size:
                0.75rem;

            padding:
                5px;

        }


        /* =====================================================
           RESPONSIVO
        ====================================================== */

        @media (
            max-width: 650px
        ) {

            body {

                padding:
                    12px 8px;

            }


            .header {

                padding:
                    20px;

                border-radius:
                    14px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

            }


            .vehicle-options {

                grid-template-columns:
                    1fr;

            }


            .route-item {

                grid-template-columns:
                    32px 1fr 38px;

                gap:
                    7px;

            }


            .titulo-editavel {

                font-size:
                    1.35rem;

            }


            .solicitacao-body {

                padding:
                    18px;

            }


            .solicitacao-header {

                padding:
                    14px 16px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="header">

        <input
            type="text"
            id="titulo"
            class="titulo-editavel"
            value="SOLICITAÇÃO DE DESPESAS DE VIAGEM"
        >

        <p>
            Preencha uma ou mais solicitações e gere todas
            em um único documento PDF.
        </p>

    </div>


    <!-- =====================================================
         SOLICITAÇÕES
    ====================================================== -->

    <div id="solicitacoes"></div>


    <!-- =====================================================
         NOVA SOLICITAÇÃO
    ====================================================== -->

    <button
        type="button"
        class="nova-solicitacao"
        onclick="adicionarSolicitacao()"
    >

        ＋ ADICIONAR NOVA SOLICITAÇÃO

    </button>


    <!-- =====================================================
         GERAR PDF
    ====================================================== -->

    <div class="actions">

        <button
            type="button"
            class="btn-pdf"
            onclick="gerarPDF()"
        >

            📄 GERAR TODAS AS SOLICITAÇÕES EM PDF

        </button>

    </div>


    <div class="footer">

        Gerador de Solicitação de Despesas de Viagem

    </div>


</div>



<script>


/* =========================================================
   CONTROLE
========================================================= */

let contadorSolicitacoes = 0;


/* =========================================================
   ADICIONAR SOLICITAÇÃO
========================================================= */

function adicionarSolicitacao() {

    contadorSolicitacoes++;

    const numero =
        contadorSolicitacoes;


    const container =
        document.getElementById(
            "solicitacoes"
        );


    const solicitacao =
        document.createElement(
            "div"
        );


    solicitacao.className =
        "solicitacao";


    solicitacao.innerHTML = `

        <div class="solicitacao-header">

            <strong>
                Solicitação ${numero}
            </strong>

            <button
                type="button"
                class="btn-remover-solicitacao"
                onclick="removerSolicitacao(this)"
            >

                Remover

            </button>

        </div>


        <div class="solicitacao-body">


            <!-- TÉCNICOS -->

            <div class="card-title">

                <span class="card-number">
                    1
                </span>

                Técnicos responsáveis pela viagem

            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Técnico responsável
                    </label>

                    <input
                        type="text"
                        class="tecnico-responsavel"
                        placeholder="Nome do técnico responsável"
                    >

                </div>


                <div class="form-group">

                    <label>

                        Técnico acompanhante

                        <span
                            style="
                                color:#8a969d;
                                font-weight:normal;
                            "
                        >
                            (opcional)
                        </span>

                    </label>

                    <input
                        type="text"
                        class="tecnico-acompanhante"
                        placeholder="Nome do técnico acompanhante"
                    >

                </div>

            </div>


            <!-- VEÍCULO -->

            <div
                class="card-title"
                style="margin-top:30px;"
            >

                <span class="card-number">
                    2
                </span>

                Veículo utilizado

            </div>


            <div class="vehicle-options">


                <div class="vehicle-option">

                    <input
                        type="radio"
                        name="veiculo-${numero}"
                        value="Veículo próprio"
                    >

                    <label class="vehicle-label">

                        🚗 Veículo próprio

                    </label>

                </div>
