<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha - Autoclave CISA AutoS7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0077b6;
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo p {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0077b6;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .btn-gerar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-gerar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 119, 182, 0.4);
        }

        .btn-gerar:active {
            transform: translateY(0);
        }

        .resultado {
            margin-top: 25px;
            padding: 25px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .resultado.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .resultado label {
            color: #90e0ef;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .resultado .senha {
            color: #00ff88;
            font-size: 2em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            letter-spacing: 3px;
            word-break: break-all;
        }

        .btn-copiar {
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid #00ff88;
            color: #00ff88;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-copiar:hover {
            background: rgba(0, 255, 136, 0.3);
        }

        .btn-hoje {
            padding: 8px 16px;
            background: #e8f4f8;
            border: 1px solid #0077b6;
            color: #0077b6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 8px;
            transition: background 0.3s;
        }

        .btn-hoje:hover {
            background: #d0ecf4;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #0077b6;
        }

        .info p {
            color: #555;
            font-size: 0.8em;
            line-height: 1.6;
        }

        .error {
            color: #e63946;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            .logo h1 {
                font-size: 1.5em;
            }
            .resultado .senha {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>CISA AutoS7</h1>
            <p>Gerador de Senha Diária</p>
        </div>

        <div class="form-group">
            <label>Número de Série (5 dígitos)</label>
            <input type="text" id="serial" placeholder="Ex: 28617" maxlength="5" inputmode="numeric">
            <span class="error" id="error-serial">Digite exatamente 5 dígitos numéricos</span>
        </div>

        <div class="form-group">
            <label>Data (DD/MM/AAAA)</label>
            <input type="text" id="data" placeholder="Ex: 13/08/2026" maxlength="10">
            <button class="btn-hoje" onclick="preencherHoje()">Usar data de hoje</button>
            <span class="error" id="error-data">Digite a data no formato DD/MM/AAAA</span>
        </div>

        <button class="btn-gerar" onclick="gerarSenha()">Gerar Senha</button>

        <div class="resultado" id="resultado">
            <label>Sua senha é</label>
            <div class="senha" id="senha-output"></div>
            <button class="btn-copiar" onclick="copiarSenha()">Copiar</button>
        </div>

        <div class="info">
            <p><strong>Instruções:</strong> Insira o número de série de 5 dígitos da autoclave e a data desejada. A senha gerada é válida apenas para o dia informado. Firmware compatível: AutoS7 V2.05.02.</p>
        </div>
    </div>

    <script>
        // Chave fixa do firmware AutoS7 V2.05.02
        const CHAVE = [11, 9, 9, 13, 10, 15, 7, 9, 10, 3, 2, 13, 11];

        function preencherHoje() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            document.getElementById('data').value = `${dia}/${mes}/${ano}`;
        }

        function validarSerial(serial) {
            return /^\d{5}$/.test(serial);
        }

        function validarData(data) {
            const regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
            const match = data.match(regex);
            if (!match) return false;
            const dia = parseInt(match[1]);
            const mes = parseInt(match[2]);
            const ano = parseInt(match[3]);
            if (dia < 1 || dia > 31) return false;
            if (mes < 1 || mes > 12) return false;
            if (ano < 2000 || ano > 2100) return false;
            return true;
        }

        function gerarSenha() {
            const serial = document.getElementById('serial').value.trim();
            const data = document.getElementById('data').value.trim();

            // Resetar erros
            document.getElementById('error-serial').classList.remove('show');
            document.getElementById('error-data').classList.remove('show');

            let temErro = false;

            if (!validarSerial(serial)) {
                document.getElementById('error-serial').classList.add('show');
                temErro = true;
            }

            if (!validarData(data)) {
                document.getElementById('error-data').classList.add('show');
                temErro = true;
            }

            if (temErro) {
                document.getElementById('resultado').classList.remove('show');
                return;
            }

            // Extrair dia, mês, ano
            const partes = data.split('/');
            const dia = partes[0];
            const mes = partes[1];
            const ano = partes[2];

            // Montar entrada: serial(5) + DDMMAAAA(8) = 13 dígitos
            const entrada = serial + dia + mes + ano;

            // Calcular senha
            let senha = '';
            for (let i = 0; i < 13; i++) {
                const digito = parseInt(entrada[i]);
                const valor = (digito + CHAVE[i]) % 16;
                senha += valor.toString(16).toUpperCase();
            }

            // Exibir resultado
            document.getElementById('senha-output').textContent = senha;
            document.getElementById('resultado').classList.add('show');
        }

        function copiarSenha() {
            const senha = document.getElementById('senha-output').textContent;
            navigator.clipboard.writeText(senha).then(() => {
                const btn = document.querySelector('.btn-copiar');
                btn.textContent = 'Copiado!';
                setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
            });
        }

        // Máscara de data automática
        document.getElementById('data').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2) value = value.slice(0, 2) + '/' + value.slice(2);
            if (value.length > 5) value = value.slice(0, 5) + '/' + value.slice(5);
            if (value.length > 10) value = value.slice(0, 10);
            e.target.value = value;
        });

        // Permitir apenas números no serial
        document.getElementById('serial').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
        });

        // Enter para gerar
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') gerarSenha();
        });
    </script>
</body>
</html>
